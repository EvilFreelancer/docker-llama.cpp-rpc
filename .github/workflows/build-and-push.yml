name: Check for new releases, build and push containers
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # every day at midnight

permissions:
  contents: read
  actions: write # required by the keepalive step below

jobs:
  compare_tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow on every run resets that timer,
      # otherwise published images silently go stale (see issue #3).
      - name: Keepalive
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/build-and-push.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install curl and jq
        run: sudo apt-get update -q && sudo apt-get install -qy curl jq

      - name: Get Docker Hub tags
        id: docker_hub_tags
        run: |
          url="https://registry.hub.docker.com/v2/repositories/${owner}/${repo}/tags/?page_size=100"
          result=$(curl -s "$url" | jq -r '.results[].name' | grep -v "latest" | grep -v "cuda")
          sorted_result=$(echo "$result" | sort -V | tr '\n' ',')
          echo "result=$sorted_result" >> "$GITHUB_OUTPUT"
        env:
          owner: evilfreelancer
          repo: llama.cpp-rpc

      - name: Get GitHub Releases
        id: github_releases
        run: |
          url="https://api.github.com/repos/${owner}/${repo}/releases"
          result=$(curl -L -s "$url" | jq -r '.[].name' | grep -E '^b[0-9]+$')
          sorted_result=$(echo "$result" | sort -V | tail -n 2 | tr '\n' ',')
          echo "result=$sorted_result" >> "$GITHUB_OUTPUT"
        env:
          owner: ggerganov
          repo: llama.cpp

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compare tags
        run: |
          docker_hub_tags="${{ steps.docker_hub_tags.outputs.result }}"
          github_releases="${{ steps.github_releases.outputs.result }}"

          IFS=',' read -r -a docker_hub_tags_array <<< "$docker_hub_tags"
          IFS=',' read -r -a github_releases_array <<< "$github_releases"

          docker buildx create --name my_builder --driver=docker-container

          # Initialize a variable to track the latest tag
          latest_tag=""

          # Build and push images with missed tag
          for tag in "${github_releases_array[@]}"; do
            if [[ ! " ${docker_hub_tags_array[*]} " =~ " $tag " ]]; then
              echo "Missing tag: $tag"
              docker buildx build --builder=my_builder --push --platform=linux/amd64 --build-arg LLAMACPP_VERSION=${tag} --tag=${owner}/${repo}:${tag} ./llama.cpp/
              docker buildx build --builder=my_builder --push --platform=linux/amd64 --file ./llama.cpp/Dockerfile.cuda --build-arg LLAMACPP_VERSION=${tag} --tag=${owner}/${repo}:${tag}-cuda ./llama.cpp/
              latest_tag=$tag
            fi
          done

          # Tagging the latest version as 'latest'
          if [ ! -z "$latest_tag" ]; then
            echo "Tagging the latest version as 'latest': $latest_tag"
            docker buildx build --builder=my_builder --push --platform=linux/amd64 --build-arg LLAMACPP_VERSION=${latest_tag} --tag=${owner}/${repo}:latest ./llama.cpp/
            docker buildx build --builder=my_builder --push --platform=linux/amd64 --file ./llama.cpp/Dockerfile.cuda --build-arg LLAMACPP_VERSION=${latest_tag} --tag=${owner}/${repo}:cuda --tag=${owner}/${repo}:latest-cuda ./llama.cpp/
          fi
        env:
          owner: evilfreelancer
          repo: llama.cpp-rpc
